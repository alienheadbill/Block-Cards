<style>
  :root{
    --paper:#F7F5EF;
    --paper-dim:#EFEBDF;
    --ink:#1B1B1B;
    --ink-soft:#5B564B;
    --red:#B3251E;
    --red-dark:#8A1B16;
    --mustard:#D9A017;
    --steel:#465358;
    --line:#D8D2C2;
    --card-shadow: 0 1px 0 rgba(0,0,0,0.05), 0 8px 20px -12px rgba(0,0,0,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fffdf8 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin:0;
  }

  /* ===== Header / Rail ===== */
  header.rail{
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:4px solid var(--red);
  }
  .rail-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:26px; font-weight:700; letter-spacing:0.06em;}
  .hamburger-btn{
    align-self:center;
    display:flex; flex-direction:column; justify-content:center; gap:4px;
    width:34px; height:34px; padding:0; background:transparent; border:1px solid rgba(247,245,239,0.3);
    border-radius:2px; margin-right:2px;
  }
  .hamburger-btn:hover{border-color:var(--paper);}
  .hamburger-btn span{display:block; width:16px; height:2px; background:var(--paper); margin:0 auto;}

  .drawer-backdrop{
    position:fixed; inset:0; background:rgba(15,14,12,0.5); z-index:150;
  }
  .drawer{
    position:absolute; top:0; left:0; bottom:0; width:280px; max-width:82vw;
    background:var(--paper); box-shadow:12px 0 30px -10px rgba(0,0,0,0.4);
    display:flex; flex-direction:column;
  }
  .drawer-head{
    background:var(--ink); color:var(--paper); padding:16px 18px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:4px solid var(--red);
  }
  .drawer-title{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.05em; font-size:15px;}
  .drawer-body{padding:14px; overflow-y:auto; flex:1;}
  .drawer-link{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; text-align:left; background:transparent; border:none;
    font-family:'IBM Plex Mono', monospace; font-size:13.5px; color:var(--ink);
    padding:11px 10px; border-radius:2px; margin-bottom:2px;
  }
  .drawer-link:hover{background:var(--paper-dim);}
  .drawer-link.active{background:var(--ink); color:var(--paper); font-weight:600;}
  .drawer-count{color:var(--ink-soft); font-size:11.5px;}
  .drawer-link.active .drawer-count{color:rgba(247,245,239,0.6);}
  .drawer-divider{height:1px; background:var(--line); margin:12px 4px;}
  .drawer-link-accent{color:var(--red); font-weight:600;}
  .drawer-link-accent:hover{background:rgba(179,37,30,0.08);}
  .brand span.tag{
    font-family:'IBM Plex Mono', monospace;
    text-transform:none;
    letter-spacing:0;
    font-size:12px;
    color:var(--mustard);
    background:rgba(217,160,23,0.12);
    border:1px solid rgba(217,160,23,0.4);
    padding:2px 8px;
    border-radius:2px;
  }
  .rail-actions{display:flex; gap:10px; flex-wrap:wrap;}
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    border-radius:2px;
    padding:10px 14px;
    border:1px solid transparent;
    transition:transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--mustard); outline-offset:2px;}
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-ghost{background:transparent; color:var(--paper); border-color:rgba(247,245,239,0.35);}
  .btn-ghost:hover{border-color:var(--paper);}
  .btn-steel{background:var(--steel); color:#fff;}
  .btn-steel:hover{background:#374045;}
  .btn-danger{background:transparent; color:var(--red); border-color:var(--red);}
  .btn-danger:hover{background:var(--red); color:#fff;}
  .btn-small{padding:6px 10px; font-size:12px;}

  main{max-width:1200px; margin:0 auto; padding:28px 20px 80px;}

  .subline{
    display:flex; align-items:center; gap:10px;
    color:var(--ink-soft); font-size:13px; margin-bottom:18px;
    padding-bottom:14px; border-bottom:1px dashed var(--line);
  }
  .dot{width:6px;height:6px;background:var(--mustard);border-radius:50%;display:inline-block;}

  /* ===== Category filter chips ===== */
  .chip-row{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px;
  }
  .chip{
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.04em;
    font-size:12px; font-weight:600; color:var(--steel);
    background:#fff; border:1px solid var(--line); border-radius:20px;
    padding:6px 14px; cursor:pointer; transition:all .12s ease;
  }
  .chip:hover{border-color:var(--steel);}
  .chip.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .chip .chip-count{opacity:0.6; margin-left:5px; font-weight:400;}

  /* ===== Section group headers ===== */
  .section-head{
    display:flex; align-items:center; gap:12px;
    margin:34px 0 16px;
  }
  .section-head:first-child{margin-top:0;}
  .section-head h3{
    font-size:15px; color:var(--red); white-space:nowrap;
  }
  .section-head .rule{flex:1; height:1px; background:var(--line);}
  .section-head .section-count{font-size:11px; color:var(--ink-soft); white-space:nowrap;}

  .cat-badge{
    display:inline-block; font-family:'Oswald', sans-serif; text-transform:uppercase;
    letter-spacing:0.04em; font-size:10px; font-weight:600; color:var(--steel);
    background:var(--paper-dim); border:1px solid var(--line);
    padding:2px 8px; border-radius:20px; margin-top:8px;
  }

  /* ===== Recipe Box Grid ===== */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:22px;
  }

  .ticket{
    background:#fff;
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--card-shadow);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .ticket:hover{transform:translateY(-3px); box-shadow:0 1px 0 rgba(0,0,0,0.06), 0 16px 30px -14px rgba(0,0,0,0.35);}
  .ticket:focus-visible{outline:2px solid var(--mustard); outline-offset:3px;}

  .perf{
    height:12px;
    background-image:radial-gradient(circle, var(--paper) 2.5px, transparent 2.6px);
    background-size:14px 14px;
    background-position:2px center;
    background-color:var(--ink);
  }
  .stub{
    position:absolute; top:12px; right:0;
    background:var(--mustard); color:var(--ink);
    font-family:'Oswald', sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.06em;
    padding:3px 10px 3px 12px;
    border-radius:3px 0 0 3px;
  }
  .ticket-body{padding:18px 18px 16px;}
  .ticket h2{font-size:19px; line-height:1.15; color:var(--ink); padding-right:60px;}
  .ticket .yield{
    font-size:11.5px; color:var(--ink-soft); margin-top:6px;
    display:flex; align-items:center; gap:6px;
  }
  .ticket .yield::before{content:"YIELD"; color:var(--red); font-weight:600; letter-spacing:0.05em; font-family:'Oswald',sans-serif; font-size:10px;}
  .ticket .counts{
    margin-top:14px; display:flex; gap:14px; font-size:11px; color:var(--steel);
    border-top:1px dashed var(--line); padding-top:10px;
  }
  .ticket .counts b{color:var(--ink); font-weight:600;}
  .ticket-actions{
    display:flex; gap:6px; flex-wrap:wrap; padding:0 18px 16px; margin-top:auto;
  }

  .empty{
    text-align:center; padding:70px 20px; color:var(--ink-soft);
    border:1px dashed var(--line); border-radius:4px; background:#fff;
  }
  .empty h3{font-size:20px; margin-bottom:8px; color:var(--ink);}

  .sync-banner{
    display:flex; align-items:center; gap:8px;
    background:#FDF3E4; border:1px solid var(--mustard); color:#7A5A0A;
    font-size:12.5px; padding:10px 14px; border-radius:3px; margin-bottom:20px;
  }
  .sync-banner::before{content:"⚠"; font-size:13px;}

  /* ===== Modal (shared shell) ===== */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,14,12,0.55);
    display:flex; align-items:flex-start; justify-content:center;
    padding:30px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:#fff; width:100%; max-width:720px; border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
    margin-bottom:40px;
  }
  .modal-head{
    background:var(--ink); color:var(--paper);
    padding:16px 22px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:4px solid var(--mustard);
  }
  .modal-head h2{font-size:18px; color:#fff;}
  .modal-close{background:transparent; color:var(--paper); border:1px solid rgba(247,245,239,0.35); padding:6px 10px; font-size:16px; line-height:1;}
  .modal-close:hover{border-color:#fff;}
  .modal-body{padding:22px;}

  /* ===== Cook Mode ===== */
  .cook-yield{
    display:inline-block; font-size:12px; color:var(--red); font-weight:600;
    background:rgba(179,37,30,0.08); border:1px solid rgba(179,37,30,0.3);
    padding:3px 9px; border-radius:2px; margin-bottom:16px;
  }
  .cook-section-title{
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.05em;
    font-size:13px; color:var(--steel); margin:22px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .cook-section-title::after{content:""; flex:1; height:1px; background:var(--line);}
  table.ing-table{width:100%; border-collapse:collapse; font-size:14px;}
  table.ing-table td{padding:7px 0; border-bottom:1px dotted var(--line); vertical-align:top;}
  table.ing-table td.ing-name{color:var(--ink);}
  table.ing-table td.ing-measure{color:var(--red); font-weight:600; text-align:right; white-space:nowrap; padding-left:14px;}

  .step{
    display:flex; gap:12px; align-items:flex-start; padding:10px 0;
    border-bottom:1px solid var(--paper-dim); font-size:14px; line-height:1.55;
  }
  .step:last-child{border-bottom:none;}
  .step-check{
    width:20px; height:20px; flex:0 0 20px; margin-top:2px;
    border:2px solid var(--steel); border-radius:3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; background:#fff;
  }
  .step-check.checked{background:var(--red); border-color:var(--red); color:#fff; font-size:13px;}
  .step-text.checked{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line);}

  .tips-box{
    background:var(--paper-dim); border-left:3px solid var(--mustard);
    padding:12px 14px; font-size:13px; color:var(--ink); margin-top:8px; white-space:pre-wrap; line-height:1.6;
  }

  /* ===== Form ===== */
  .field{margin-bottom:16px;}
  .import-help{font-size:13px; color:var(--ink-soft); margin-bottom:16px; line-height:1.55;}
  .cat-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .cat-reorder{display:flex; flex-direction:column; gap:2px; flex:0 0 auto;}
  .cat-move{
    width:24px; height:17px; padding:0; background:#fff; border:1px solid var(--line);
    color:var(--steel); font-size:9px; line-height:1; border-radius:2px; display:flex; align-items:center; justify-content:center;
  }
  .cat-move:hover:not(:disabled){border-color:var(--steel); color:var(--ink);}
  .cat-move:disabled{opacity:0.3; cursor:default;}
  .cat-name-input{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:14px;
    padding:9px 10px; border:1px solid var(--line); border-radius:2px; background:#fdfcf9; color:var(--ink);
  }
  .cat-name-input:focus{outline:2px solid var(--mustard); outline-offset:0; border-color:var(--mustard);}
  .cat-row-count{font-size:11.5px; color:var(--ink-soft); min-width:22px; text-align:center; flex:0 0 auto;}
  .field label{
    display:block; font-family:'Oswald', sans-serif; text-transform:uppercase;
    letter-spacing:0.04em; font-size:11.5px; color:var(--steel); margin-bottom:6px;
  }
  .field input, .field textarea, .field select{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:14px;
    padding:9px 10px; border:1px solid var(--line); border-radius:2px; background:#fdfcf9; color:var(--ink);
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--mustard); outline-offset:0; border-color:var(--mustard);}
  .field textarea{resize:vertical; min-height:70px;}
  .field select{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:32px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .ing-row, .step-row{display:flex; gap:8px; margin-bottom:8px; align-items:flex-start;}
  .ing-row input:first-child{flex:3;}
  .ing-row input:last-child{flex:1; min-width:70px;}
  .step-row textarea{flex:1; min-height:44px;}
  .row-remove{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 10px; font-size:14px; flex:0 0 auto;
  }
  .row-remove:hover{border-color:var(--red); color:var(--red);}
  .add-row-btn{
    background:transparent; border:1px dashed var(--steel); color:var(--steel);
    width:100%; padding:9px; font-size:12.5px; margin-top:2px;
  }
  .add-row-btn:hover{border-color:var(--ink); color:var(--ink);}
  .form-actions{display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:16px; border-top:1px dashed var(--line);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:3px;
    font-size:13px; z-index:200; border-left:4px solid var(--mustard);
    box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  }

  .loading-line{color:var(--ink-soft); font-size:13px; padding:40px; text-align:center;}

  @media (max-width:640px){
    .brand h1{font-size:20px;}
    .row2{grid-template-columns:1fr;}
    table.ing-table td.ing-measure{white-space:normal;}
    .ing-row{flex-wrap:wrap;}
    .ing-row input:first-child{flex:1 1 100%;}
    .ing-row input:last-child{flex:1 1 auto;}
  }
</style>
</head>
<body>

<header class="rail">
  <div class="rail-inner">
    <div class="brand">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <h1>Recipe Blocks</h1>
      <span class="tag">build your own</span>
    </div>
    <div class="rail-actions">
      <button class="btn-ghost" id="printBtn">Print all</button>
      <button class="btn-primary" id="newBtn">+ New recipe</button>
    </div>
  </div>
</header>

<div id="drawerBackdrop" class="drawer-backdrop" style="display:none;">
  <nav class="drawer">
    <div class="drawer-head">
      <span class="drawer-title">Menu</span>
      <button class="modal-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-body">
      <button class="drawer-link active" id="drawerAll">
        <span>All recipes</span><span class="drawer-count" id="drawerAllCount"></span>
      </button>
      <div id="drawerCats"></div>

      <div class="drawer-divider"></div>

      <button class="drawer-link drawer-link-accent" id="drawerImport">
        <span>Import recipe…</span>
      </button>
      <button class="drawer-link" id="drawerNewFromMenu">
        <span>+ New recipe (blank)</span>
      </button>

      <div class="drawer-divider"></div>

      <button class="drawer-link" id="drawerManageCats">
        <span>Manage categories…</span>
      </button>
      <button class="drawer-link" id="drawerExport">
        <span>Export backup (.json)</span>
      </button>
      <button class="drawer-link" id="drawerRestore">
        <span>Restore from backup…</span>
      </button>
      <input type="file" id="restoreFileInput" accept=".json,application/json" style="display:none;">
    </div>
  </nav>
</div>

<main>
  <div class="subline"><span class="dot"></span> <span id="countLine">Loading recipe box…</span></div>
  <div id="syncBanner" class="sync-banner" style="display:none;"></div>
  <div id="chipRow" class="chip-row"></div>
  <div id="grid" class="grid"></div>
</main>


<div id="toastHost"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "recipes";
  let recipes = [];
  let categories = [];
  let loaded = false;
  let currentFilter = 'All';
  const DEFAULT_CATEGORIES = ['Sauces & Seasonings', 'Proteins', 'Sides & Toppings', 'Mains'];

  const grid = document.getElementById('grid');
  const countLine = document.getElementById('countLine');

  // ---------- Seed data ----------
  // Blank template: no starter recipes, so a new team can build their own box
  // from scratch. The default categories still give a helpful starting structure.
  function seedData(){
    return [];
  }

  function cryptoId(){
    return 'r' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  // ---------- Storage ----------
  function delay(ms){ return new Promise(res=>setTimeout(res, ms)); }

  let syncMode = 'shared'; // tracks which storage scope last succeeded: 'shared' | 'private' | null

  function setSyncStatus(ok, privateOnly){
    const banner = document.getElementById('syncBanner');
    if(ok && !privateOnly){
      banner.style.display = 'none';
    }else if(ok && privateOnly){
      banner.style.display = 'flex';
      banner.textContent = 'Saving to this device only right now — shared syncing with your team isn\u2019t available, so new changes won\u2019t show up for others until it\u2019s back.';
    }else{
      banner.style.display = 'flex';
      banner.textContent = 'Working locally in this browser tab — changes aren\u2019t syncing right now, so they may not appear on other devices or after a refresh.';
    }
  }

  async function tryStorageSet(shared){
    try{
      const payload = JSON.stringify({ recipes, categories });
      const result = await window.storage.set(STORAGE_KEY, payload, shared);
      return !!result;
    }catch(e){
      return { error: e };
    }
  }

  // Tries shared storage, then falls back to private (per-device) storage
  // so data still persists somewhere if team-wide sharing is unavailable.
  // Only a single attempt per scope — if storage is genuinely down,
  // hammering it with retries just adds noise without helping.
  async function saveRecipes(opts){
    opts = opts || {};
    const silent = !!opts.silent;

    const sharedResult = await tryStorageSet(true);
    if(sharedResult === true){ syncMode = 'shared'; setSyncStatus(true, false); return true; }

    const privateResult = await tryStorageSet(false);
    if(privateResult === true){ syncMode = 'private'; setSyncStatus(true, true); return true; }

    const sharedErrMsg = (sharedResult && sharedResult.error && sharedResult.error.message) || 'unknown error';
    const privateErrMsg = (privateResult && privateResult.error && privateResult.error.message) || 'unknown error';
    console.error('Storage unavailable — shared write failed (' + sharedErrMsg + '), private write failed (' + privateErrMsg + ').');
    setSyncStatus(false, false);
    if(!silent) showToast('Saved on this device — syncing is currently unavailable');
    return false;
  }

  async function loadRecipes(){
    let res = null;
    try{
      res = await window.storage.get(STORAGE_KEY, true);
      if(res) syncMode = 'shared';
    }catch(e){ res = null; }

    if(!res){
      try{
        res = await window.storage.get(STORAGE_KEY, false);
        if(res) syncMode = 'private';
      }catch(e2){ res = null; }
    }

    let parsed = null;
    try{ parsed = res && res.value ? JSON.parse(res.value) : null; }catch(e3){ parsed = null; }

    if(Array.isArray(parsed)){
      // Backward compatibility: earlier version stored a bare recipe array.
      recipes = parsed;
      categories = [...DEFAULT_CATEGORIES];
    }else if(parsed && typeof parsed === 'object'){
      recipes = Array.isArray(parsed.recipes) ? parsed.recipes : [];
      categories = Array.isArray(parsed.categories) ? parsed.categories : [...DEFAULT_CATEGORIES];
    }else{
      recipes = [];
      categories = [];
    }

    if(!recipes.length){
      recipes = seedData();
      categories = [...DEFAULT_CATEGORIES];
      // First-run seeding: retry quietly so a transient hiccup on load
      // doesn't greet a brand-new user with an error toast.
      await saveRecipes({silent:true});
    }

    loaded = true;
    render();
  }

  function showToast(msg){
    const host = document.getElementById('toastHost');
    host.innerHTML = '';
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    host.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 2200);
  }

  // Custom confirm dialog — the browser's built-in confirm() can silently
  // do nothing inside a sandboxed preview iframe, so we render our own.
  function showConfirm(message, confirmLabel){
    return new Promise(resolve => {
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal" style="max-width:400px;">
          <div class="modal-head">
            <h2>Please confirm</h2>
            <button class="modal-close" data-cancel>✕</button>
          </div>
          <div class="modal-body">
            <p style="font-size:14px; line-height:1.55; margin:0 0 20px;">${escapeHtml(message)}</p>
            <div class="form-actions" style="justify-content:flex-end; border-top:none; padding-top:0;">
              <button type="button" class="btn-ghost" style="color:var(--ink); border-color:var(--line);" data-cancel>Cancel</button>
              <button type="button" class="btn-danger" data-confirm>${escapeHtml(confirmLabel || 'Confirm')}</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);
      const finish = (result) => { backdrop.remove(); resolve(result); };
      backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) finish(false); });
      backdrop.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click', ()=>finish(false)));
      backdrop.querySelector('[data-confirm]').addEventListener('click', ()=>finish(true));
    });
  }

  // ---------- Categories ----------
  function getCategory(r){
    return (r.category && r.category.trim()) ? r.category.trim() : 'Uncategorized';
  }

  function allCategoriesInOrder(){
    const present = new Set(recipes.map(getCategory));
    const base = categories.length ? categories : DEFAULT_CATEGORIES;
    const ordered = base.filter(c=>c!=='Uncategorized');
    const extras = [...present].filter(c=>c!=='Uncategorized' && !ordered.includes(c)).sort((a,b)=>a.localeCompare(b));
    const withoutUncat = [...ordered, ...extras];
    if(present.has('Uncategorized')) withoutUncat.push('Uncategorized');
    return withoutUncat;
  }

  function renderChips(){
    const cats = allCategoriesInOrder();
    if(!currentFilter || (currentFilter!=='All' && !cats.includes(currentFilter))) currentFilter = 'All';
    const chipRow = document.getElementById('chipRow');
    if(!recipes.length){ chipRow.innerHTML = ''; return; }
    const chips = [{label:'All', count:recipes.length}].concat(
      cats.map(c=>({label:c, count:recipes.filter(r=>getCategory(r)===c).length}))
    );
    chipRow.innerHTML = chips.map(c => `
      <button type="button" class="chip ${currentFilter===c.label ? 'active':''}" data-cat="${escapeHtml(c.label)}">
        ${escapeHtml(c.label)}<span class="chip-count">${c.count}</span>
      </button>
    `).join('');
    chipRow.querySelectorAll('.chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        currentFilter = btn.dataset.cat;
        render();
      });
    });
  }

  // ---------- Render: grid ----------
  function render(){
    if(!loaded){
      grid.innerHTML = '<div class="loading-line">Loading recipe box…</div>';
      return;
    }
    countLine.textContent = recipes.length
      ? recipes.length + ' recipe block' + (recipes.length===1?'':'s') + ' in the box — shared with everyone using this app'
      : 'No recipe blocks yet';

    renderChips();
    renderDrawer();

    if(!recipes.length){
      grid.innerHTML = '<div class="empty"><h3>The box is empty</h3><p>Add your first recipe block to get started.</p></div>';
      return;
    }

    const cats = allCategoriesInOrder();
    const visibleCats = currentFilter === 'All' ? cats : cats.filter(c=>c===currentFilter);

    grid.innerHTML = '';
    let globalIdx = 0;
    visibleCats.forEach(cat => {
      const inCat = recipes.filter(r=>getCategory(r)===cat);
      if(!inCat.length) return;

      const head = document.createElement('div');
      head.className = 'section-head';
      head.style.gridColumn = '1 / -1';
      head.innerHTML = `<h3>${escapeHtml(cat)}</h3><div class="rule"></div><div class="section-count">${inCat.length} block${inCat.length===1?'':'s'}</div>`;
      grid.appendChild(head);

      inCat.forEach(r => {
        globalIdx++;
        const el = document.createElement('div');
        el.className = 'ticket';
        el.tabIndex = 0;
        el.setAttribute('role','button');
        el.setAttribute('aria-label', 'Open ' + r.name);
        el.innerHTML = `
          <div class="perf"></div>
          <div class="ticket-body">
            <div class="stub">#${String(globalIdx).padStart(2,'0')}</div>
            <h2>${escapeHtml(r.name)}</h2>
            <div class="yield">${escapeHtml(r.yield||'—')}</div>
            <div class="counts">
              <span><b>${r.ingredients.length}</b> ingredients</span>
              <span><b>${r.steps.length}</b> steps</span>
            </div>
            <div class="cat-badge">${escapeHtml(cat)}</div>
          </div>
          <div class="ticket-actions">
            <button class="btn-steel btn-small" data-action="cook" data-id="${r.id}">Cook mode</button>
            <button class="btn-ghost btn-small" style="color:var(--ink); border-color:var(--line);" data-action="edit" data-id="${r.id}">Edit</button>
            <button class="btn-ghost btn-small" style="color:var(--ink); border-color:var(--line);" data-action="print" data-id="${r.id}">Print</button>
          </div>
        `;
        el.addEventListener('click', (e)=>{
          if(e.target.closest('button')) return;
          openCookMode(r.id);
        });
        el.addEventListener('keypress', (e)=>{ if(e.key==='Enter') openCookMode(r.id); });
        grid.appendChild(el);
      });
    });

    grid.querySelectorAll('[data-action="cook"]').forEach(b=>b.addEventListener('click', ()=>openCookMode(b.dataset.id)));
    grid.querySelectorAll('[data-action="edit"]').forEach(b=>b.addEventListener('click', ()=>openForm(b.dataset.id)));
    grid.querySelectorAll('[data-action="print"]').forEach(b=>b.addEventListener('click', ()=>{
      const r = recipes.find(x=>x.id===b.dataset.id);
      if(r) downloadPrintable([r], `recipe-${slugify(r.name)}`, r.name);
    }));

    if(!grid.innerHTML.trim()){
      grid.innerHTML = `<div class="empty"><h3>No recipes here yet</h3><p>"${escapeHtml(currentFilter)}" doesn't have any recipe blocks in it yet.</p></div>`;
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  // ---------- Cook mode modal ----------
  let checkedSteps = {};

  function openCookMode(id){
    const r = recipes.find(x=>x.id===id);
    if(!r) return;
    checkedSteps = {};

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>${escapeHtml(r.name)}</h2>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn-ghost" style="padding:6px 10px; font-size:12px;" data-print>Print</button>
            <button class="modal-close" data-close>✕</button>
          </div>
        </div>
        <div class="modal-body">
          <div class="cat-badge" style="margin-bottom:10px;">${escapeHtml(getCategory(r))}</div>
          <span class="cook-yield">YIELD — ${escapeHtml(r.yield||'—')}</span>

          <div class="cook-section-title">Ingredients</div>
          <table class="ing-table">
            ${r.ingredients.map(i=>`<tr><td class="ing-name">${escapeHtml(i.name)}</td><td class="ing-measure">${escapeHtml(i.measure||'')}</td></tr>`).join('')}
          </table>

          <div class="cook-section-title">Procedure</div>
          <div id="stepsList">
            ${r.steps.map((s,i)=>`
              <div class="step" data-i="${i}">
                <div class="step-check" data-i="${i}"></div>
                <div class="step-text" data-i="${i}">${escapeHtml(s)}</div>
              </div>
            `).join('')}
          </div>

          ${r.tips ? `<div class="cook-section-title">Tips</div><div class="tips-box">${escapeHtml(r.tips)}</div>` : ''}
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    backdrop.querySelectorAll('.step-check').forEach(cb=>{
      cb.addEventListener('click', ()=>{
        const i = cb.dataset.i;
        checkedSteps[i] = !checkedSteps[i];
        cb.classList.toggle('checked', checkedSteps[i]);
        cb.textContent = checkedSteps[i] ? '✓' : '';
        backdrop.querySelector(`.step-text[data-i="${i}"]`).classList.toggle('checked', checkedSteps[i]);
      });
    });

    backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) backdrop.remove(); });
    backdrop.querySelector('[data-close]').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelector('[data-print]').addEventListener('click', ()=>{
      downloadPrintable([r], `recipe-${slugify(r.name)}`, r.name);
    });
  }

  // ---------- Add / Edit form ----------
  function blankRecipe(){
    return { id: cryptoId(), name:'', category:'', yield:'', ingredients:[{name:'',measure:''}], steps:[''], tips:'' };
  }

  function openForm(id, prefillDraft){
    const isEdit = !!id;
    const existing = isEdit ? recipes.find(r=>r.id===id) : (prefillDraft || blankRecipe());
    const draft = JSON.parse(JSON.stringify(existing));

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>${isEdit ? 'Edit recipe block' : 'New recipe block'}</h2>
          <button class="modal-close" data-close>✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>Recipe name</label>
            <input type="text" id="f-name" value="${escapeHtml(draft.name)}" placeholder="e.g. Chop Sauce">
          </div>
          <div class="row2">
            <div class="field">
              <label>Category</label>
              <select id="f-category-select">
                <option value="">— Uncategorized —</option>
                ${allCategoriesInOrder().filter(c=>c!=='Uncategorized').map(c=>
                  `<option value="${escapeHtml(c)}" ${draft.category===c?'selected':''}>${escapeHtml(c)}</option>`
                ).join('')}
                ${(draft.category && !allCategoriesInOrder().includes(draft.category))
                  ? `<option value="${escapeHtml(draft.category)}" selected>${escapeHtml(draft.category)}</option>`
                  : ''}
                <option value="__new__">+ Add new category…</option>
              </select>
              <input type="text" id="f-category-new" placeholder="New category name" style="display:none; margin-top:8px;">
            </div>
            <div class="field">
              <label>Yield</label>
              <input type="text" id="f-yield" value="${escapeHtml(draft.yield)}" placeholder="e.g. 2½ cups (20 oz)">
            </div>
          </div>

          <div class="field">
            <label>Ingredients</label>
            <div id="ingRows"></div>
            <button type="button" class="add-row-btn" id="addIng">+ Add ingredient</button>
          </div>

          <div class="field">
            <label>Procedure steps</label>
            <div id="stepRows"></div>
            <button type="button" class="add-row-btn" id="addStep">+ Add step</button>
          </div>

          <div class="field">
            <label>Tips (optional)</label>
            <textarea id="f-tips" placeholder="Any tips, variations, or holding notes">${escapeHtml(draft.tips)}</textarea>
          </div>

          <div class="form-actions">
            <div>${isEdit ? '<button type="button" class="btn-danger btn-small" id="deleteBtn">Delete recipe</button>' : ''}</div>
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn-ghost" style="color:var(--ink); border-color:var(--line);" data-close>Cancel</button>
              <button type="button" class="btn-primary" id="saveBtn">Save recipe</button>
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);

    const ingRows = backdrop.querySelector('#ingRows');
    const stepRows = backdrop.querySelector('#stepRows');

    function renderIngRows(){
      ingRows.innerHTML = '';
      draft.ingredients.forEach((ing, i)=>{
        const row = document.createElement('div');
        row.className = 'ing-row';
        row.innerHTML = `
          <input type="text" placeholder="Ingredient" value="${escapeHtml(ing.name)}" data-i="${i}" data-field="name">
          <input type="text" placeholder="Measure" value="${escapeHtml(ing.measure)}" data-i="${i}" data-field="measure">
          <button type="button" class="row-remove" data-i="${i}">✕</button>
        `;
        ingRows.appendChild(row);
      });
      ingRows.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('input', ()=>{ draft.ingredients[inp.dataset.i][inp.dataset.field] = inp.value; });
      });
      ingRows.querySelectorAll('.row-remove').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          draft.ingredients.splice(btn.dataset.i,1);
          if(!draft.ingredients.length) draft.ingredients.push({name:'',measure:''});
          renderIngRows();
        });
      });
    }

    function renderStepRows(){
      stepRows.innerHTML = '';
      draft.steps.forEach((s, i)=>{
        const row = document.createElement('div');
        row.className = 'step-row';
        row.innerHTML = `
          <textarea placeholder="Step ${i+1}" data-i="${i}">${escapeHtml(s)}</textarea>
          <button type="button" class="row-remove" data-i="${i}">✕</button>
        `;
        stepRows.appendChild(row);
      });
      stepRows.querySelectorAll('textarea').forEach(ta=>{
        ta.addEventListener('input', ()=>{ draft.steps[ta.dataset.i] = ta.value; });
      });
      stepRows.querySelectorAll('.row-remove').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          draft.steps.splice(btn.dataset.i,1);
          if(!draft.steps.length) draft.steps.push('');
          renderStepRows();
        });
      });
    }

    renderIngRows();
    renderStepRows();

    backdrop.querySelector('#addIng').addEventListener('click', ()=>{
      draft.ingredients.push({name:'',measure:''});
      renderIngRows();
    });
    backdrop.querySelector('#addStep').addEventListener('click', ()=>{
      draft.steps.push('');
      renderStepRows();
    });

    backdrop.querySelector('#f-name').addEventListener('input', (e)=>{ draft.name = e.target.value; });
    backdrop.querySelector('#f-yield').addEventListener('input', (e)=>{ draft.yield = e.target.value; });
    backdrop.querySelector('#f-tips').addEventListener('input', (e)=>{ draft.tips = e.target.value; });

    const catSelect = backdrop.querySelector('#f-category-select');
    const catNewInput = backdrop.querySelector('#f-category-new');
    if(catSelect.value === '__new__'){
      catNewInput.style.display = 'block';
    }
    catSelect.addEventListener('change', ()=>{
      if(catSelect.value === '__new__'){
        catNewInput.style.display = 'block';
        catNewInput.value = '';
        catNewInput.focus();
        draft.category = '';
      }else{
        catNewInput.style.display = 'none';
        draft.category = catSelect.value;
      }
    });
    catNewInput.addEventListener('input', (e)=>{ draft.category = e.target.value; });

    backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) backdrop.remove(); });
    backdrop.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>backdrop.remove()));

    const deleteBtn = backdrop.querySelector('#deleteBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', async ()=>{
        const confirmed = await showConfirm('Delete "' + existing.name + '"? This cannot be undone.', 'Delete recipe');
        if(!confirmed) return;
        recipes = recipes.filter(r=>r.id !== id);
        const ok = await saveRecipes({silent:true});
        backdrop.remove();
        render();
        showToast(ok ? 'Recipe deleted' : 'Deleted on this device — syncing is currently unavailable');
      });
    }

    backdrop.querySelector('#saveBtn').addEventListener('click', async ()=>{
      if(!draft.name.trim()){
        showToast('Give the recipe a name first');
        return;
      }
      draft.ingredients = draft.ingredients.filter(i=>i.name.trim() || i.measure.trim());
      draft.steps = draft.steps.filter(s=>s.trim());
      if(!draft.ingredients.length) draft.ingredients = [{name:'',measure:''}];
      if(!draft.steps.length) draft.steps = [''];

      const typedCat = (draft.category || '').trim();
      if(typedCat && !categories.some(c=>c.toLowerCase()===typedCat.toLowerCase())){
        categories.push(typedCat);
      }

      if(isEdit){
        const idx = recipes.findIndex(r=>r.id===id);
        recipes[idx] = draft;
      }else{
        recipes.push(draft);
      }
      const ok = await saveRecipes({silent:true});
      backdrop.remove();
      render();
      if(ok){
        showToast(isEdit ? 'Recipe updated' : 'Recipe added to the box');
      }else{
        showToast('Saved on this device — syncing is currently unavailable');
      }
    });
  }

  // ---------- Hamburger drawer ----------
  function renderDrawer(){
    const cats = allCategoriesInOrder();
    const drawerAllCount = document.getElementById('drawerAllCount');
    const drawerAll = document.getElementById('drawerAll');
    if(drawerAllCount) drawerAllCount.textContent = recipes.length;
    if(drawerAll) drawerAll.classList.toggle('active', currentFilter === 'All');

    const catsHost = document.getElementById('drawerCats');
    if(!catsHost) return;
    catsHost.innerHTML = cats.map(c=>{
      const count = recipes.filter(r=>getCategory(r)===c).length;
      return `<button type="button" class="drawer-link ${currentFilter===c?'active':''}" data-cat="${escapeHtml(c)}">
        <span>${escapeHtml(c)}</span><span class="drawer-count">${count}</span>
      </button>`;
    }).join('');
    catsHost.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        currentFilter = btn.dataset.cat;
        closeDrawer();
        render();
      });
    });
  }

  function openDrawer(){
    document.getElementById('drawerBackdrop').style.display = 'block';
    renderDrawer();
  }
  function closeDrawer(){
    document.getElementById('drawerBackdrop').style.display = 'none';
  }

  // ---------- Manage categories ----------
  function renderCategoryRows(container){
    if(!categories.length){
      container.innerHTML = '<p style="font-size:13px; color:var(--ink-soft);">No categories yet — add one below.</p>';
      return;
    }
    container.innerHTML = categories.map((c, idx) => {
      const count = recipes.filter(r=>getCategory(r)===c).length;
      const isFirst = idx === 0;
      const isLast = idx === categories.length - 1;
      return `
        <div class="cat-row" data-idx="${idx}">
          <div class="cat-reorder">
            <button type="button" class="cat-move" data-dir="up" data-idx="${idx}" ${isFirst ? 'disabled' : ''} aria-label="Move up">▲</button>
            <button type="button" class="cat-move" data-dir="down" data-idx="${idx}" ${isLast ? 'disabled' : ''} aria-label="Move down">▼</button>
          </div>
          <input type="text" class="cat-name-input" data-idx="${idx}" value="${escapeHtml(c)}">
          <span class="cat-row-count">${count}</span>
          <button type="button" class="row-remove" data-idx="${idx}">✕</button>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.cat-move').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = Number(btn.dataset.idx);
        const dir = btn.dataset.dir;
        const swapWith = dir === 'up' ? idx - 1 : idx + 1;
        if(swapWith < 0 || swapWith >= categories.length) return;
        [categories[idx], categories[swapWith]] = [categories[swapWith], categories[idx]];
        await saveRecipes({silent:true});
        render();
        renderCategoryRows(container);
      });
    });

    container.querySelectorAll('.cat-name-input').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const idx = Number(inp.dataset.idx);
        const oldName = categories[idx];
        const newName = inp.value.trim();
        if(!newName){ inp.value = oldName; return; }
        if(newName === oldName) return;
        const isDup = categories.some((c,i)=> i!==idx && c.toLowerCase()===newName.toLowerCase());
        if(isDup){
          showToast('That category already exists');
          inp.value = oldName;
          return;
        }
        categories[idx] = newName;
        recipes.forEach(r=>{ if((r.category||'').trim() === oldName) r.category = newName; });
        await saveRecipes({silent:true});
        render();
        renderCategoryRows(container);
        showToast('Category renamed');
      });
    });

    container.querySelectorAll('.row-remove').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const idx = Number(btn.dataset.idx);
        const catName = categories[idx];
        const count = recipes.filter(r=>getCategory(r)===catName).length;
        const msg = count > 0
          ? `Delete "${catName}"? Its ${count} recipe${count===1?'':'s'} will move to Uncategorized.`
          : `Delete "${catName}"?`;
        const ok = await showConfirm(msg, 'Delete category');
        if(!ok) return;
        categories.splice(idx, 1);
        recipes.forEach(r=>{ if((r.category||'').trim() === catName) r.category = ''; });
        await saveRecipes({silent:true});
        render();
        renderCategoryRows(container);
        showToast('Category deleted');
      });
    });
  }

  function openManageCategoriesModal(){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>Manage categories</h2>

  // ---------- Manual backup / restore (works even if cloud storage is down) ----------
  function exportBackup(){
    const blob = new Blob([JSON.stringify({ recipes, categories }, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `recipe-blocks-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  }

  function normalizeImportedRecipe(r){
    return {
      id: (r && r.id) || cryptoId(),
      name: (r && r.name) || 'Untitled recipe',
      category: (r && r.category) || '',
      yield: (r && r.yield) || '',
      ingredients: (r && Array.isArray(r.ingredients) && r.ingredients.length)
        ? r.ingredients.map(i => ({ name: (i && i.name) || '', measure: (i && i.measure) || '' }))
        : [{name:'', measure:''}],
      steps: (r && Array.isArray(r.steps) && r.steps.length) ? r.steps.map(String) : [''],
      tips: (r && r.tips) || ''
    };
  }

  async function restoreFromFile(file){
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);

      let importedRecipes, importedCategories;
      if(Array.isArray(parsed)){
        // Older backup format: a bare recipe array
        importedRecipes = parsed;
        importedCategories = [...DEFAULT_CATEGORIES];
      }else if(parsed && Array.isArray(parsed.recipes)){
        importedRecipes = parsed.recipes;
        importedCategories = Array.isArray(parsed.categories) ? parsed.categories : [...DEFAULT_CATEGORIES];
      }else{
        throw new Error('Backup file is not a recognized recipe backup');
      }

      const count = importedRecipes.length;
      const confirmed = await showConfirm(`Replace all ${recipes.length} recipes currently in the box with the ${count} recipes from this backup? This cannot be undone.`, 'Restore backup');
      if(!confirmed) return;
      recipes = importedRecipes.map(normalizeImportedRecipe);
      categories = importedCategories;
      const ok = await saveRecipes({silent:true});
      render();
      showToast(ok ? 'Backup restored' : 'Backup restored on this device — syncing is currently unavailable');
    }catch(e){
      console.error('Restore failed:', e);
      showToast('That file didn\u2019t look like a valid backup');
    }
  }

  // ---------- AI-assisted recipe import ----------
  async function parseRecipeWithAI(rawText){
    const prompt = `You are extracting a recipe into structured JSON for a professional kitchen recipe app. Read the raw recipe text below (it may include unrelated clutter like ads, comments, or navigation text scraped from a webpage — ignore anything that isn't actually part of the recipe) and respond with ONLY a single JSON object and nothing else: no markdown code fences, no commentary before or after. Match exactly this shape:

{
  "name": string,
  "category": string (choose the closest fit from "Sauces & Seasonings", "Proteins", "Sides & Toppings", "Mains" — or write a short new category if none of those fit),
  "yield": string (e.g. "4 servings" or "2 cups"),
  "ingredients": [{"name": string, "measure": string}],
  "steps": [string, ...],
  "tips": string (any notes, variations, or holding/storage tips; empty string if none)
}

Keep step text concise and action-first, like a kitchen prep card. Here is the raw recipe text:
"""
${rawText.slice(0, 6000)}
"""`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if(!response.ok) throw new Error('Request failed with status ' + response.status);
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const cleaned = textBlocks.replace(/```json|```/g, '').trim();
    return JSON.parse(cleaned);
  }

  function openImportModal(){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h2>Import recipe</h2>
          <button class="modal-close" data-close>✕</button>
        </div>
        <div class="modal-body">
          <p class="import-help">Copy a recipe from any website, note, or document and paste it below — or upload a text file. Claude reads it and fills out a recipe card for you to check over before it's saved to the box.</p>
          <div class="field">
            <label>Upload a file (optional)</label>
            <input type="file" id="importFile" accept=".txt,.md,.csv,text/plain">
          </div>
          <div class="field">
            <label>Paste recipe text</label>
            <textarea id="importText" style="min-height:170px;" placeholder="Paste the recipe here — ingredients, steps, whatever you've got"></textarea>
          </div>
          <div class="form-actions" style="justify-content:flex-end; border-top:none; padding-top:4px;">
            <button type="button" class="btn-ghost" style="color:var(--ink); border-color:var(--line);" data-close>Cancel</button>
            <button type="button" class="btn-primary" id="parseBtn">Parse with AI</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) backdrop.remove(); });
    backdrop.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>backdrop.remove()));

    const fileInput = backdrop.querySelector('#importFile');
    const textarea = backdrop.querySelector('#importText');
    const parseBtn = backdrop.querySelector('#parseBtn');

    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = () => { textarea.value = String(reader.result || ''); };
      reader.onerror = () => { showToast('Could not read that file'); };
      reader.readAsText(file);
    });

    parseBtn.addEventListener('click', async () => {
      const raw = textarea.value.trim();
      if(!raw){ showToast('Paste some recipe text first, or upload a file'); return; }

      parseBtn.disabled = true;
      const originalLabel = parseBtn.textContent;
      parseBtn.textContent = 'Parsing…';

      try{
        const parsed = await parseRecipeWithAI(raw);
        const draft = {
          id: cryptoId(),
          name: (parsed.name || '').toString(),
          category: (parsed.category || '').toString(),
          yield: (parsed.yield || '').toString(),
          ingredients: (Array.isArray(parsed.ingredients) && parsed.ingredients.length)
            ? parsed.ingredients.map(i => ({ name: (i && i.name) || '', measure: (i && i.measure) || '' }))
            : [{name:'', measure:''}],
          steps: (Array.isArray(parsed.steps) && parsed.steps.length) ? parsed.steps.map(String) : [''],
          tips: (parsed.tips || '').toString()
        };
        backdrop.remove();
        openForm(null, draft);
        showToast('Recipe parsed — review it, then save');
      }catch(e){
        console.error('Recipe parse failed:', e);
        showToast('Could not parse that text — try pasting more of the recipe, or add it manually');
        parseBtn.disabled = false;
        parseBtn.textContent = originalLabel;
      }
    });
  }

  // ---------- Print sheet ----------
  function slugify(name){
    return (name || 'recipe').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'recipe';
  }

  // Builds a standalone, self-contained HTML page for printing — independent
  // of window.print(), which can be silently blocked inside a sandboxed
  // preview iframe. This gets downloaded so it opens (and prints) reliably
  // in a real browser tab, in preview or once published.
  function buildPrintableDocument(list, titleText){
    const cats = allCategoriesInOrder();
    const groups = cats
      .map(cat => ({ cat, items: list.filter(r=>getCategory(r)===cat) }))
      .filter(g => g.items.length);

    const cardsHtml = groups.map(g => `
      <div class="section-head">${escapeHtml(g.cat)}</div>
      ${g.items.map(r => `
        <div class="card">
          <h2>${escapeHtml(r.name)}</h2>
          <div class="yield">YIELD: ${escapeHtml(r.yield || '—')}</div>
          <div class="cols">
            <div>
              ${r.ingredients.map(i=>`<div class="ing"><span>${escapeHtml(i.name)}</span><span>${escapeHtml(i.measure||'')}</span></div>`).join('')}
              ${r.tips ? `<div class="tips"><strong>TIPS:</strong> ${escapeHtml(r.tips)}</div>` : ''}
            </div>
            <ol class="steps">
              ${r.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}
            </ol>
          </div>
        </div>
      `).join('')}
    `).join('');

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>${escapeHtml(titleText)}</title>
<style>
  body{ font-family: 'Courier New', monospace; color:#1B1B1B; background:#fff; margin:0; padding:28px; }
  h1{ font-family: Arial, sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:20px; margin:0 0 20px; border-bottom:3px solid #B3251E; padding-bottom:10px; }
  .section-head{ font-family:Arial, sans-serif; text-transform:uppercase; font-size:14px; color:#B3251E; margin:22px 0 10px; border-bottom:1px solid #999; padding-bottom:4px; letter-spacing:0.04em; }
  .card{ break-inside:avoid; page-break-inside:avoid; border:1px solid #999; padding:14px 16px; margin:0 0 16px; }
  .card h2{ font-size:16px; margin:0 0 2px; font-family:Arial, sans-serif; }
  .yield{ font-size:11px; color:#444; margin-bottom:8px; }
  .cols{ display:grid; grid-template-columns:1fr 1.4fr; gap:16px; }
  .ing{ font-size:11px; border-bottom:1px dotted #ccc; padding:3px 0; display:flex; justify-content:space-between; }
  .steps{ font-size:11px; line-height:1.5; margin:0; padding-left:18px; }
  .steps li{ margin-bottom:3px; }
  .tips{ font-size:10.5px; margin-top:8px; border-top:1px dashed #ccc; padding-top:6px; color:#333; }
  @media print{ body{ padding:0 20px; } }
</style>
</head>
<body>
  <h1>${escapeHtml(titleText)}</h1>
  ${cardsHtml}
</body>
</html>`;
  }

  function downloadPrintable(list, filenameBase, titleText){
    if(!list.length){ showToast('Nothing to print yet'); return; }
    const html = buildPrintableDocument(list, titleText);
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${filenameBase}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Printable page downloaded — open it, then print or save as PDF');
  }

  document.getElementById('newBtn').addEventListener('click', ()=>openForm(null));
  document.getElementById('printBtn').addEventListener('click', ()=>{
    downloadPrintable(recipes, 'recipe-blocks-all-recipes', 'Recipe Blocks — All Recipes');
  });

  document.getElementById('hamburgerBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerBackdrop').addEventListener('click', (e)=>{
    if(e.target.id === 'drawerBackdrop') closeDrawer();
  });
  document.getElementById('drawerAll').addEventListener('click', ()=>{
    currentFilter = 'All';
    closeDrawer();
    render();
  });
  document.getElementById('drawerImport').addEventListener('click', ()=>{
    closeDrawer();
    openImportModal();
  });
  document.getElementById('drawerNewFromMenu').addEventListener('click', ()=>{
    closeDrawer();
    openForm(null);
  });
  document.getElementById('drawerManageCats').addEventListener('click', ()=>{
    closeDrawer();
    openManageCategoriesModal();
  });
  document.getElementById('drawerExport').addEventListener('click', ()=>{
    closeDrawer();
    exportBackup();
  });
  document.getElementById('drawerRestore').addEventListener('click', ()=>{
    document.getElementById('restoreFileInput').click();
  });
  document.getElementById('restoreFileInput').addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    closeDrawer();
    e.target.value = '';
    if(file) restoreFromFile(file);
  });

  loadRecipes();
})();
</script>
